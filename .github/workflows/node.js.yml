# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
  DISABLE_ERD: true

jobs:
  build:
    # ubuntu-latest (24.04) renamed several Chromium deps (e.g. libasound2 → libasound2t64);
    # keep 22.04 until the manual apt list (or Puppeteer --install-deps) is updated for Noble.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: prisma_schema
        with:
          filters: |
            schema:
              - "prisma/schema.prisma"
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
      - run: npm ci
      - name: Verify data model ERD matches Prisma schema
        if: steps.prisma_schema.outputs.schema == 'true'
        env:
          DISABLE_ERD: "false"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libcairo2 libcups2 \
            libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnss3 \
            libpango-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 \
            libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 \
            libxrender1 libxss1 libxtst6
          npm run prisma:generate
          git diff --exit-code docs/data-model-full-erd.svg docs/core-data-model-erd.svg docs/packing-data-model-erd.svg docs/rides-data-model-erd.svg docs/tasks-data-model-erd.svg docs/notifications-data-model-erd.svg || (
            echo "::error::ERD SVGs are out of date. Run \`npm run prisma:generate\` locally and commit the SVGs under \`docs/\` listed in \`docs/DATA_MODEL.md\`."
            exit 1
          )
      - run: npm run build --if-present
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
